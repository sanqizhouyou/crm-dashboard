<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代运营商机公示看板 · 美团餐饮SaaS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: #f5f5f5;
  color: #333;
  padding: 24px;
  min-height: 100vh;
}

/* 顶部 */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.header h1 {
  font-size: 22px;
  color: #1a1a1a;
  font-weight: 700;
}
.header .actions {
  display: flex;
  gap: 8px;
}
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}
.btn-primary {
  background: #FFD700;
  color: #1a1a1a;
}
.btn-primary:hover { background: #e6c200; }
.btn-outline {
  background: #fff;
  color: #333;
  border: 1px solid #ddd;
}
.btn-outline:hover { background: #f0f0f0; }

/* 表格 */
.table-wrap {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  overflow: hidden;
}
table {
  width: 100%;
  border-collapse: collapse;
}
thead {
  background: #1a1a2e;
  color: #fff;
}
th {
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
}
td {
  padding: 10px 14px;
  border-top: 1px solid #f0f0f0;
  vertical-align: middle;
}
tr:hover td { background: #fafafa; }

td input, td select {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 13px;
  background: #fff;
}
td input:focus, td select:focus {
  outline: none;
  border-color: #FFD700;
  box-shadow: 0 0 0 2px rgba(255,215,0,0.2);
}

/* 下拉 */
select {
  cursor: pointer;
}
select option {
  padding: 4px;
}

/* 审核状态 */
.status-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
}
.status-pending { background: #fff3cd; color: #856404; }
.status-pass { background: #d4edda; color: #155724; }
.status-fail { background: #f8d7da; color: #721c24; }

/* 图片 */
.img-cell {
  width: 80px;
}
.img-thumb {
  width: 60px;
  height: 60px;
  border: 1px solid #ddd;
  border-radius: 4px;
  object-fit: cover;
  cursor: pointer;
  transition: transform 0.2s;
}
.img-thumb:hover { transform: scale(1.05); }
.img-upload {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border: 2px dashed #ddd;
  border-radius: 4px;
  cursor: pointer;
  color: #999;
  font-size: 24px;
  transition: border-color 0.2s;
}
.img-upload:hover { border-color: #FFD700; color: #FFD700; }
.img-upload input { display: none; }
/* 删除按钮列 */
th:last-child, td:last-child {
  width: 40px;
  text-align: center;
}
.delete-btn {
  color: #dc3545;
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
  border-radius: 4px;
  transition: background 0.2s;
}
.delete-btn:hover { background: #fff0f0; }

/* 统计 */
.stats {
  display: flex;
  gap: 20px;
  margin-bottom: 16px;
}
.stat-item {
  background: #fff;
  padding: 12px 20px;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  font-size: 13px;
  color: #666;
}
.stat-item b { font-size: 18px; color: #1a1a1a; }
.stat-pass { border-left: 3px solid #28a745; }
.stat-fail { border-left: 3px solid #dc3545; }
.stat-pending { border-left: 3px solid #ffc107; }
.stat-total { border-left: 3px solid #1a1a2e; }

/* 模态框 - 大图预览 */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 999;
  align-items: center;
  justify-content: center;
}
.modal.show { display: flex; }
.modal img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 8px;
}
.modal-close {
  position: absolute;
  top: 20px; right: 20px;
  color: #fff;
  font-size: 28px;
  cursor: pointer;
}

/* 列宽 */
th:nth-child(1), td:nth-child(1) { width: 80px; }  /* 姓名 */
th:nth-child(2), td:nth-child(2) { width: 140px; } /* 品牌 */
th:nth-child(3), td:nth-child(3) { width: 110px; } /* 代运营 */
th:nth-child(4), td:nth-child(4) { width: 100px; } /* 报价 */
th:nth-child(5), td:nth-child(5) { width: 80px; }  /* 截图 */
th:nth-child(6), td:nth-child(6) { width: 100px; } /* CM审核 */
</style>
</head>
<body>

<div class="header">
  <h1>📋 代运营商机公示看板</h1>
  <div class="actions">
    <button class="btn btn-primary" onclick="addRow()">+ 添加商机</button>
    <button class="btn btn-outline" onclick="clearAll()">清空全部</button>
  </div>
</div>

<div class="stats">
  <div class="stat-item stat-total">
    总商机 <b id="statTotal">0</b>
  </div>
  <div class="stat-item stat-pass">
    通过 <b id="statPass">0</b>
  </div>
  <div class="stat-item stat-pending">
    待审核 <b id="statPending">0</b>
  </div>
  <div class="stat-item stat-fail">
    不通过 <b id="statFail">0</b>
  </div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>姓名</th>
  <th>品牌</th>
  <th>代运营产品</th>
  <th>报价</th>
  <th>沟通截图</th>
  <th>CM审核</th>
  <th></th>
</tr>
</thead>
<tbody id="tableBody">
</tbody>
</table>
</div>

<!-- 大图预览 -->
<div class="modal" id="imgModal" onclick="document.getElementById('imgModal').classList.remove('show')">
  <span class="modal-close" onclick="event.stopPropagation(); document.getElementById('imgModal').classList.remove('show')">&times;</span>
  <img id="modalImg" src="" alt="预览">
</div>

<script>
/* ===== 数据 ===== */
const STORAGE_KEY = 'daiYunBizBoard';
let data = [];

const PRODUCTS = ['团购代运营', '外卖代运营', '私域代运营', '供应链代运营'];

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    data = JSON.parse(saved);
  }
  render();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  updateStats();
}

function updateStats() {
  const total = data.length;
  const pass = data.filter(d => d.audit === '通过').length;
  const pending = data.filter(d => d.audit === '待审核').length;
  const fail = data.filter(d => d.audit === '不通过').length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPass').textContent = pass;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statFail').textContent = fail;
}

function addRow() {
  const id = Date.now();
  data.push({ id, name: '', brand: '', product: '', price: '', screenshot: '', audit: '待审核' });
  saveData();
  render();
}

function deleteRow(id) {
  data = data.filter(d => d.id !== id);
  saveData();
  render();
}

function updateField(id, field, value) {
  const item = data.find(d => d.id === id);
  if (item) { item[field] = value; saveData(); }
}

function handleScreenshot(id, file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    updateField(id, 'screenshot', e.target.result);
    render();
  };
  reader.readAsDataURL(file);
}

function previewImg(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('imgModal').classList.add('show');
}

function clearAll() {
  if (confirm('确定清空全部商机数据？此操作不可恢复。')) {
    data = [];
    saveData();
    render();
  }
}

function render() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  data.forEach(item => {
    const tr = document.createElement('tr');
    
    // 姓名
    tr.innerHTML += '<td><input type="text" value="' + (item.name || '') + '" placeholder="姓名" oninput="updateField(' + item.id + ',\'name\',this.value)"></td>';
    
    // 品牌
    tr.innerHTML += '<td><input type="text" value="' + (item.brand || '') + '" placeholder="品牌名称" oninput="updateField(' + item.id + ',\'brand\',this.value)"></td>';
    
    // 代运营产品 - 下拉
    let optHtml = PRODUCTS.map(p => '<option value="' + p + '"' + (item.product === p ? ' selected' : '') + '>' + p + '</option>').join('');
    tr.innerHTML += '<td><select onchange="updateField(' + item.id + ',\'product\',this.value)">' + optHtml + '</select></td>';
    
    // 报价
    tr.innerHTML += '<td><input type="text" value="' + (item.price || '') + '" placeholder="报价金额" oninput="updateField(' + item.id + ',\'price\',this.value)"></td>';
    
    // 沟通截图
    if (item.screenshot) {
      tr.innerHTML += '<td class="img-cell"><img class="img-thumb" src="' + item.screenshot + '" onclick="previewImg(\'' + item.screenshot + '\')" alt="截图"></td>';
    } else {
      tr.innerHTML += '<td class="img-cell"><label class="img-upload" title="点击上传截图"><input type="file" accept="image/*" onchange="handleScreenshot(' + item.id + ',this.files[0])">+</label></td>';
    }
    
    // CM审核 - 下拉
    tr.innerHTML += '<td><select onchange="updateField(' + item.id + ',\'audit\',this.value)">' +
      '<option value="待审核"' + (item.audit === '待审核' ? ' selected' : '') + '>待审核</option>' +
      '<option value="通过"' + (item.audit === '通过' ? ' selected' : '') + '>通过</option>' +
      '<option value="不通过"' + (item.audit === '不通过' ? ' selected' : '') + '>不通过</option>' +
      '</select></td>';
    
    // 删除
    tr.innerHTML += '<td><span class="delete-btn" onclick="deleteRow(' + item.id + ')" title="删除">×</span></td>';
    
    tbody.appendChild(tr);
  });
}

// 初始化
loadData();
</script>
</body>
</html>
